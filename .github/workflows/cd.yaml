# Releases this plugin. docs/releasing.md explains what that means in practice: which pull request
# labels ship a change, why the versions are generated rather than semver, and how to cut a release
# deliberately rather than by merging.
#
# The "additional setup" the archetype's note asks for is done: the permissions file carries
# cd: enabled: true, MAVEN_USERNAME and MAVEN_TOKEN are provisioned, and ci.jenkins.io produces the
# `Jenkins` check that the validate job below gates on. Background, if it is ever needed again:
# https://www.jenkins.io/redirect/continuous-delivery-of-plugins
#
---
name: cd
on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: |
          Run validation with release drafter only
          → Skip the release job
        # Note: Change this default to true,
        #       if the checkbox should be checked by default.
        default: false
  # If you don't want any automatic trigger in general, then
  # the following check_run trigger lines should all be commented.
  # Note: Consider the use case #2 config for 'validate_only' below
  #       as an alternative option!
  check_run:
    types:
      - completed

permissions:
  checks: read
  contents: write

jobs:
  maven-cd:
    # Pinned to a commit rather than the mutable @v1 tag: this is the workflow that receives the
    # Artifactory credentials, so it is the one where a moved tag would matter most. Matches the
    # pin in jenkinsci/archetypes. Renovate/Dependabot will offer updates via the comment.
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      # Comment / uncomment the validate_only config appropriate to your preference:
      #
      # Use case #1 (automatic release):
      #   - Let any successful Jenkins build trigger another release,
      #     if there are merged pull requests of interest
      #   - Perform a validation only run with drafting a release note,
      #     if manually triggered AND inputs.validate_only has been checked.
      #
      validate_only: ${{ inputs.validate_only == true }}
      #
      # Alternative use case #2 (no automatic release):
      #   - Same as use case #1 - but:
      #     - Let any check_run trigger a validate_only run.
      #       => enforce the release job to be skipped.
      #
      #validate_only: ${{ inputs.validate_only == true || github.event_name == 'check_run' }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
