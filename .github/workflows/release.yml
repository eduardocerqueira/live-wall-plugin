name: Release

# Cut a release by pushing a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# or by running this workflow by hand with a version. Either way it builds the plugin at that
# version, writes the changelog from the pull requests merged since the previous tag, and publishes
# both to https://github.com/eduardocerqueira/jenkins-live-wall/releases
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the history behind the tag

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # A release is not a place to discover a broken test.
      - name: Build and test at the release version
        run: |
          mvn -B -ntp \
            -Drevision="${{ steps.version.outputs.version }}" \
            -Dchangelist= \
            clean verify

      - name: Tag the release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Live Wall ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # The build always produces target/live-wall.hpi; give the published asset the version so
      # that a downloaded file is still identifiable six months later.
      - name: Name the artefact
        run: cp target/live-wall.hpi "live-wall-${{ steps.version.outputs.version }}.hpi"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Live Wall ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "${args[@]}" \
            "live-wall-${{ steps.version.outputs.version }}.hpi"
