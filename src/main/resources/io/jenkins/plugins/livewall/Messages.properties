LiveWallView.DisplayName=Live Wall
LiveWallView.Description=A full-screen wall of coloured tiles, one per job, sized so that every job fits on the screen at once. Built to be left running on an office TV.

LiveWallView.NoJobs=Nothing to show. No jobs in this view yet.
LiveWallView.NothingWrong=All green. Nothing needs attention.

LiveWallView.RefreshTooFast=Refresh at least {0} seconds apart, otherwise the wall will hammer the controller.
LiveWallView.RefreshTooSlow=Refresh no more than {0} seconds apart, otherwise the wall stops being live.
LiveWallView.RefreshBusy=Below five seconds each open wall adds noticeable load on a controller with many jobs.
LiveWallView.TileHeightRange=Enter a minimum tile height between {0} and {1} pixels.
LiveWallView.BadRegex=Not a valid regular expression: {0}
LiveWallView.BadColor=Enter a CSS hex colour such as #12d96a, or a colour keyword such as tomato.
LiveWallView.GapRange=Enter a gap between 0 and {0} pixels.
LiveWallView.SeamRange=Enter a separator between 0 and {0} pixels.
LiveWallView.SeamZero=With no separator, neighbouring tiles of the same colour merge into one block and stop being countable.
LiveWallView.IncludeAll=Every job in the view.
LiveWallView.ExcludeNone=Nothing excluded.
